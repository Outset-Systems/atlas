name: Feature request
description: Suggest something the Atlas should do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first; the best solution may not be the first
        one that comes to mind. Please use example names and addresses
        (`home.example`, `192.0.2.0/24`), not your real ones.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: How it might look or behave. Sketches and examples welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
      description: Workarounds you use now, or other tools that do this.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - the map and its scenes
        - editing the map
        - live health (Prometheus, Loki, Uptime Kuma, decoys)
        - sign-in, accounts, LDAP, MFA
        - import or export (CSV, NetBox, nmap)
        - install, Docker, configuration
        - API
        - documentation
        - something else
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I would like to work on this myself.
