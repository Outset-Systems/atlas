name: secrets

# gitleaks over the whole history on every push and pull request. The binary
# is downloaded from the gitleaks release and checked against its published
# SHA-256 (no third-party action, no licence key needed for an org repo).

on:
  push:
  pull_request:

permissions: {}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
      - name: Scan the history
        run: |
          "$RUNNER_TEMP/gitleaks" git \
            --config .github/gitleaks.toml \
            --redact \
            --verbose \
            --exit-code 1 \
            .
