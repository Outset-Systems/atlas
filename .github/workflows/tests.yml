name: tests

on:
  push:
  pull_request:
  # image.yml runs this before it publishes a release image
  workflow_call:

permissions: {}

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            Web/requirements-lock.txt
            Web/requirements-test.txt
      - name: Install dependencies
        run: pip install --require-hashes -r Web/requirements-lock.txt -r Web/requirements-test.txt
      - name: Every file compiles
        run: python -m compileall -q Web relay docs
      - name: Unit tests
        run: python -m pytest Web/tests -q -p no:cacheprovider
      - name: The app boots on the demo lab and refuses a write
        working-directory: Web
        env:
          ATLAS_AUTH_MODE: standalone
          ATLAS_READONLY: "1"
          ATLAS_FALLBACK: bundled
        run: |
          export ATLAS_DATA="$RUNNER_TEMP/atlas/lab-data.json"
          mkdir -p "$RUNNER_TEMP/atlas"
          python - <<'EOF'
          from app import app
          c = app.test_client()
          for path in ("/", "/api/v2/health", "/api/v2/lab-data", "/api/v2/overview", "/api/v2/openapi.json"):
              assert c.get(path).status_code == 200, path
          assert c.get("/api/v2/lab-data").get_json()["nodes"], "the demo lab is empty"
          assert c.post("/api/v2/admin/apply", json={"ops": []}).status_code >= 400, "a write was accepted"
          EOF
      - name: Every environment variable is documented
        run: python docs/env-coverage.py

  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          # no package.json: nothing to install or cache
          package-manager-cache: false
      - name: Every script parses
        run: find Web/static/js -name '*.js' -not -path '*/vendor/*' -print0 | xargs -0 -n1 node --check
      # every function the boot sequence calls is defined somewhere
      - name: Boot wiring check
        run: node tools/check-boot.mjs Web/static/js
