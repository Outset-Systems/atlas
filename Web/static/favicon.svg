<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="The Atlas">
  <!-- Illuminated Cartography (the design notes): gilded accents on engraved ink. The
       four-point compass star is the app's own mark (◈ / ✦), gilt on an ink
       disc so it reads on a light or dark browser tab alike. One static file
       (ALIVE.md THE LIST #18) — a declared icon stops the /favicon.ico 404. -->
  <circle cx="16" cy="16" r="15" fill="#1d2021"/>
  <circle cx="16" cy="16" r="14.5" fill="none" stroke="#C9A554" stroke-width="1" opacity="0.55"/>
  <!-- compass star: long N/S/E/W points, short diagonals -->
  <path d="M16 3 L18 14 L16 16 L14 14 Z" fill="#E4C878"/>
  <path d="M16 29 L14 18 L16 16 L18 18 Z" fill="#C9A554"/>
  <path d="M3 16 L14 14 L16 16 L14 18 Z" fill="#C9A554"/>
  <path d="M29 16 L18 18 L16 16 L18 14 Z" fill="#E4C878"/>
  <path d="M16 16 L21 11 L20 12.5 L17.5 15 Z" fill="#C9A554" opacity="0.7"/>
  <path d="M16 16 L11 21 L12.5 20 L15 17.5 Z" fill="#C9A554" opacity="0.7"/>
  <path d="M16 16 L21 21 L19.5 20 L17.5 17.5 Z" fill="#C9A554" opacity="0.7"/>
  <path d="M16 16 L11 11 L12.5 12.5 L15 15 Z" fill="#C9A554" opacity="0.7"/>
  <circle cx="16" cy="16" r="1.6" fill="#E4C878"/>
</svg>
