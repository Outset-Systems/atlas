[pytest]
testpaths = tests
# The default basetemp lives under the system temp directory, which a sandboxed
# or locked-down account may not be able to create in — that failure looks like
# five broken signals tests rather than "pytest could not make a directory".
# Keeping it beside the suite makes the run reproducible anywhere.
addopts = -q --basetemp=.pytest-tmp
filterwarnings =
    ignore::DeprecationWarning
